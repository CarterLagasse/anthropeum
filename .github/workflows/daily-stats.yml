name: Daily stats

# Runs whenever a stat file is pushed: file it under data/, refresh the
# dashboard, then commit and push with retry. Runs are serialized so uploads
# seconds apart can never race each other.

on:
  push:
    branches: [main]
    paths:
      - '[0-9]*_[0-9]*'
      - 'data/**'
      - 'index.html'
      - 'build_dashboard.py'
      - '.github/workflows/daily-stats.yml'
  workflow_dispatch:

permissions:
  contents: write

# Queue runs instead of letting two instances interleave pushes
concurrency:
  group: daily-stats
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Archive root stat files into data/
        run: |
          for f in *; do
            if [[ -f "$f" && "$f" =~ ^[0-9]+_[0-9]+$ ]]; then
              # The year comes from the file's own date line, e.g. "Oct 28 2026"
              YEAR=$(head -n 1 "$f" | grep -oE '20[0-9]{2}' | head -n 1)
              folder="data/${f%%_*}_${YEAR: -2}"
              mkdir -p "$folder"
              git mv "$f" "$folder/"
            fi
          done

      - name: Update dashboard
        run: python build_dashboard.py

      - name: Commit if changed
        id: commit
        run: |
          git add index.html data/
          if git diff --cached --quiet; then
            echo "changed=0" >> $GITHUB_OUTPUT
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Auto daily stats: archive + dashboard"
          echo "changed=1" >> $GITHUB_OUTPUT

      - name: Push with retry
        if: steps.commit.outputs.changed == '1'
        run: |
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push; then
              exit 0
            fi
            echo "push rejected (attempt $attempt), rebasing and retrying..."
            sleep 5
          done
          echo "::error::push failed after 3 attempts"
          exit 1
