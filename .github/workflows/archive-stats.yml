name: Archive daily stats

on:
  push:
    branches: [main]
    paths:
      - '[0-9]*_[0-9]*'
      - '.github/workflows/archive-stats.yml'
      - 'generate_readme.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Read year from generate_readme.py
        id: year
        run: |
          YEAR=$(python -c 'import re; m=re.search(r"^YEAR\s*=\s*(\d+)", open("generate_readme.py").read(), re.M); print(m.group(1))' 2>/dev/null) || true
          if [ -z "$YEAR" ]; then YEAR=2026; fi
          echo "year=$YEAR" >> $GITHUB_OUTPUT
      - name: Archive root stat files into data/
        run: |
          YEAR=${{ steps.year.outputs.year }}
          YY="${YEAR: -2}"
          MOVED=0
          for f in *; do
            # only loose files in root matching M_D (e.g. 10_21, 8_1)
            if [[ -f "$f" && "$f" =~ ^[0-9]+_[0-9]+$ ]]; then
              month="${f%%_*}"
              folder="data/${month}_${YY}"
              mkdir -p "$folder"
              git mv "$f" "$folder/"
              MOVED=1
            fi
          done
          if [ "$MOVED" -eq 1 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Auto-archive stat files into data/${YY}"
            # the Update README workflow may have pushed a commit while we ran — rebase on it
            git pull --rebase origin main
            git push
          else
            echo "No root stat files to archive"
          fi
