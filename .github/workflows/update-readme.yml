name: Update README

on:
  push:
    branches: [main]
    paths:
      - '[0-9]*_[0-9]*'
      - '**/[0-9]*_[0-9]*'
      - 'august/**'
      - 'september/**'
      - 'january/**'
      - 'february/**'
      - 'march/**'
      - 'april/**'
      - 'may/**'
      - 'june/**'
      - 'july/**'
      - 'october/**'
      - 'november/**'
      - 'december/**'
      - 'generate_readme.py'
      - 'generate_charts.py'
      - '.github/workflows/update-readme.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Regenerate README and charts
        run: |
          python generate_readme.py
          python generate_charts.py
      - name: Commit if changed
        run: |
          git add README.md assets/
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Auto README and charts"
          # the Archive workflow may have pushed a commit while we ran — rebase on it
          git pull --rebase origin main
          git push

